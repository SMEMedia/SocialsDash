# Copy this file to secrets.toml or .streamlit/secrets.toml for local use.
# In Streamlit Community Cloud, paste the same structure into the app's Secrets settings.
# Never commit real credentials.

youtube_redirect_uri = "https://smemediasocials.streamlit.app/"

[meta]
app_id = "REPLACE_ME"
app_secret = "REPLACE_ME"
user_access_token = "REPLACE_ME"
page_access_token = "REPLACE_ME"

[instagram]
app_secret = "REPLACE_ME"
access_token = "REPLACE_ME"

[youtube_web_oauth_client]
client_id = "REPLACE_ME"
client_secret = "REPLACE_ME"
project_id = "REPLACE_ME"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
redirect_uris = ["https://smemediasocials.streamlit.app/"]

[youtube_oauth_token]
refresh_token = "REPLACE_ME"
token_uri = "https://oauth2.googleapis.com/token"
client_id = "REPLACE_ME"
client_secret = "REPLACE_ME"
scopes = [
  "https://www.googleapis.com/auth/youtube.readonly",
  "https://www.googleapis.com/auth/yt-analytics.readonly"
]
